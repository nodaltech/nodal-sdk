# nginx front end for the Office 365 Nodal feeder.
#
# Microsoft Graph will only deliver change notifications to a publicly
# resolvable HTTPS endpoint with a certificate from a public CA. Self signed
# will not do: the subscription's validationToken handshake fails with no
# useful error on the Microsoft side.
#
# Install as /etc/nginx/sites-available/o365-feeder and symlink into
# sites-enabled, then: nginx -t && systemctl reload nginx

upstream o365_feeder {
    server 127.0.0.1:8099;
    keepalive 8;
}

# notifications arrive in bursts when a drive sees a batch of activity
limit_req_zone $binary_remote_addr zone=o365_webhook:1m rate=50r/s;

server {
    listen 80;
    listen [::]:80;
    server_name o365-feed.example.com;

    # certbot lives here, everything else goes to TLS
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx < 1.25 wants `listen 443 ssl http2;` instead of this directive
    http2 on;
    server_name o365-feed.example.com;

    ssl_certificate     /etc/letsencrypt/live/o365-feed.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/o365-feed.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/o365-feeder.access.log;
    error_log  /var/log/nginx/o365-feeder.error.log;

    # notifications are a few KB at most
    client_max_body_size 256k;

    # Must match WEBHOOK_PATH in o365_feeder.yaml, and the path in
    # NOTIFICATION_URL. Graph appends ?validationToken=... to this same path
    # during the subscription handshake, which nginx passes through.
    location = /webhook/o365 {
        limit_req zone=o365_webhook burst=100 nodelay;

        proxy_pass http://o365_feeder;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Graph counts a notification delivered only on a 2xx within 3 seconds,
        # and marks an endpoint "slow" once more than 10% of responses miss
        # that. The feeder fetches delta inline, so this budget sits above
        # Graph's 3s and below its 10s retry timeout - better to fail fast and
        # be redelivered than to be marked slow and have notifications dropped.
        proxy_connect_timeout 2s;
        proxy_send_timeout 8s;
        proxy_read_timeout 8s;

        # the feeder answers as soon as it is done, buffering only adds latency
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
