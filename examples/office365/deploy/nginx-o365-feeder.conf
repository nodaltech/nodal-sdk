# nginx front end for the Office 365 Nodal feeder.
#
# Microsoft will only deliver notifications to a publicly resolvable HTTPS
# endpoint with a certificate from a public CA - self signed will not do, and
# the subscription's validation handshake will simply fail.
#
# Install as /etc/nginx/sites-available/o365-feeder and symlink into
# sites-enabled, then: nginx -t && systemctl reload nginx

upstream o365_feeder {
    server 127.0.0.1:8099;
    keepalive 4;
}

# notifications arrive in bursts after each content blob is sealed
limit_req_zone $binary_remote_addr zone=o365_webhook:1m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name o365-feed.example.com;

    # certbot lives here, everything else goes to TLS
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx < 1.25 wants `listen 443 ssl http2;` instead of this directive
    http2 on;
    server_name o365-feed.example.com;

    ssl_certificate     /etc/letsencrypt/live/o365-feed.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/o365-feed.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/o365-feeder.access.log;
    error_log  /var/log/nginx/o365-feeder.error.log;

    # notifications are a few KB at most
    client_max_body_size 256k;

    # Must match WEBHOOK_PATH in o365_feeder.yaml, and the path in WEBHOOK_URL.
    location = /webhook/o365 {
        limit_req zone=o365_webhook burst=60 nodelay;

        proxy_pass http://o365_feeder;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Microsoft gives up on the validation handshake after 5 seconds, so
        # fail fast rather than holding the connection open
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;

        # the feeder answers immediately, buffering only adds latency
        proxy_buffering off;
    }

    # Health/stats endpoint - keep it off the internet. Uncomment and scope to
    # your monitoring hosts if you want it reachable.
    location = /healthz {
        # allow 10.0.0.0/8;
        deny all;
        proxy_pass http://o365_feeder;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
